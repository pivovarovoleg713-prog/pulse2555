<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Pulse PRO MED</title>

<style>
body{
  font-family:Arial;
  color:#fff;
  text-align:center;
  padding:20px;

  /* 🖼️ ФОН */
  background: url("https://images.unsplash.com/photo-1588776814546-ec7e3d3a8c92") no-repeat center center fixed;
  background-size: cover;
}

#pulse{
  font-size:80px;
  margin:10px;
  text-shadow:0 0 10px red;
}

button{
  padding:10px;
  margin:5px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

.circle{
  width:25px;
  height:25px;
  border-radius:50%;
  margin:auto;
}

.green{background:#22c55e}
.yellow{background:#eab308}
.red{background:#ef4444}

.status{
  display:inline-block;
  margin:10px;
}

#cameraOverlay{
  position:fixed;
  inset:0;
  background:rgba(255,0,0,0);
  pointer-events:none;
}

#cameraOverlay.active{
  background:rgba(255,0,0,0.6);
}

video{display:none}
</style>
</head>

<body>

<h1>🫀 Pulse PRO MED</h1>
<div id="pulse">--</div>

<button onclick="startAuto()">▶️ Старт</button>
<button onclick="oneRandom()">🎲 Случайный</button>
<button onclick="startCamera()">📷 Мой пульс (ФПГ)</button>
<button onclick="stopAll()">⛔ Стоп</button>

<div>
<div class="status"><div id="arr" class="circle green"></div><div>Аритмия</div></div>
<div class="status"><div id="brady" class="circle green"></div><div>Брадикардия</div></div>
<div class="status"><div id="tachy" class="circle green"></div><div>Тахикардия</div></div>
</div>

<div id="cameraOverlay"></div>
<video id="video" autoplay playsinline></video>

<script>
let autoInt;
let camInt;
let samples=[];
let last=80;

const pulseEl=document.getElementById('pulse');
const arr=document.getElementById('arr');
const brady=document.getElementById('brady');
const tachy=document.getElementById('tachy');
const video=document.getElementById('video');
const overlay=document.getElementById('cameraOverlay');

// 🎯 СОСТОЯНИЯ
function updateState(p){
  let a='green', b='green', t='green';

  if(p<60) b='red';
  else if(p>=100) t='red';

  let diff=Math.abs(p-last);
  if(diff>20) a='red';
  else if(diff>10) a='yellow';

  arr.className='circle '+a;
  brady.className='circle '+b;
  tachy.className='circle '+t;

  last=p;
}

// 🎲 случайный
function rand(a,b){
  return Math.floor(Math.random()*(b-a+1))+a;
}

function oneRandom(){
  stopCamera();
  let p=rand(50,160);
  pulseEl.textContent=p;
  updateState(p);
}

function startAuto(){
  stopCamera();
  if(autoInt) return;
  autoInt=setInterval(oneRandom,5000);
  oneRandom();
}

// 📷 ФПГ (УЛУЧШЕННЫЙ)
async function startCamera(){
  stopAll();

  try{
    const stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:"environment"}
    });

    video.srcObject=stream;
    overlay.classList.add('active');

    samples=[];

    camInt=setInterval(()=>{
      const c=document.createElement('canvas');
      c.width=80;
      c.height=80;
      const ctx=c.getContext('2d');

      ctx.drawImage(video,0,0,80,80);

      let data=ctx.getImageData(0,0,80,80).data;

      let red=0;
      for(let i=0;i<data.length;i+=4){
        red+=data[i];
      }

      let avg=red/(data.length/4);
      samples.push(avg);

      // держим историю
      if(samples.length>100){

        // сглаживание
        let smooth=[];
        for(let i=1;i<samples.length;i++){
          smooth.push((samples[i]+samples[i-1])/2);
        }

        let peaks=0;

        for(let i=2;i<smooth.length;i++){
          if(
            smooth[i-1] > smooth[i-2] &&
            smooth[i-1] > smooth[i] &&
            smooth[i-1] > smooth[i-3]
          ){
            peaks++;
          }
        }

        let bpm=Math.round(peaks * 1.5);

        if(bpm>40 && bpm<180){
          pulseEl.textContent=bpm;
          updateState(bpm);
        }

        samples.shift();
      }

    },200);

  }catch(e){
    alert("❌ Камера не работает. Нужен HTTPS или доступ запрещён.");
  }
}

// ⛔ стоп
function stopCamera(){
  clearInterval(camInt);
  overlay.classList.remove('active');

  if(video.srcObject){
    video.srcObject.getTracks().forEach(t=>t.stop());
  }
}

function stopAll(){
  clearInterval(autoInt);
  autoInt=null;
  stopCamera();
}

</script>

</body>
</html>
