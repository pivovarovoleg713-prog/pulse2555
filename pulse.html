<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Pulse PRO FINAL</title>

<link rel="manifest" href="manifest.json">

<style>
body{
  font-family:Arial;
  background:#0b1220;
  color:#fff;
  text-align:center;
  padding:20px;
}

#pulse{
  font-size:80px;
  margin:10px;
}

button{
  padding:10px;
  margin:5px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

.green{background:#22c55e}
.red{background:#ef4444}
.yellow{background:#eab308}

.circle{
  width:25px;
  height:25px;
  border-radius:50%;
  margin:auto;
}

.status{
  display:inline-block;
  margin:10px;
}

#cameraOverlay{
  position:fixed;
  inset:0;
  background:rgba(255,0,0,0);
  pointer-events:none;
}

#cameraOverlay.active{
  background:rgba(255,0,0,0.5);
}

video{display:none}
</style>
</head>

<body>

<h1>🫀 Pulse PRO FINAL</h1>
<div id="pulse">--</div>

<button onclick="startAuto()">▶️ Старт</button>
<button onclick="oneRandom()">🎲 Случайный пульс</button>
<button onclick="startCamera()">📷 Свой пульс (ФПГ)</button>
<button onclick="stopAll()">⛔ Стоп</button>
<button id="installApp">📱 Установить</button>

<div>
<div class="status"><div id="arr" class="circle green"></div><div>Аритмия</div></div>
<div class="status"><div id="brady" class="circle green"></div><div>Брадикардия</div></div>
<div class="status"><div id="tachy" class="circle green"></div><div>Тахикардия</div></div>
</div>

<div id="cameraOverlay"></div>
<video id="video" autoplay playsinline></video>

<script>
let autoInt;
let camInt;
let samples=[];
let last=80;

const pulseEl=document.getElementById('pulse');
const arr=document.getElementById('arr');
const brady=document.getElementById('brady');
const tachy=document.getElementById('tachy');
const video=document.getElementById('video');
const overlay=document.getElementById('cameraOverlay');

// 📱 установка
let deferredPrompt;
window.addEventListener('beforeinstallprompt',(e)=>{
  e.preventDefault();
  deferredPrompt=e;
});
document.getElementById('installApp').onclick=()=>{
  if(deferredPrompt) deferredPrompt.prompt();
};

// 🎯 состояния
function updateState(p){
  let a='green', b='green', t='green';

  if(p<60) b='red';
  else if(p>=100) t='red';

  let diff=Math.abs(p-last);
  if(diff>20) a='red';
  else if(diff>10) a='yellow';

  arr.className='circle '+a;
  brady.className='circle '+b;
  tachy.className='circle '+t;

  last=p;
}

// 🎲 случайный
function rand(a,b){
  return Math.floor(Math.random()*(b-a+1))+a;
}

function oneRandom(){
  stopCamera();
  let p=rand(50,160);
  pulseEl.textContent=p;
  updateState(p);
}

function startAuto(){
  stopCamera();
  if(autoInt) return;
  autoInt=setInterval(oneRandom,5000);
  oneRandom();
}

// 📷 ФПГ
async function startCamera(){
  stopAll();

  try{
    const stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:"environment"}
    });

    video.srcObject=stream;
    overlay.classList.add('active');
    samples=[];

    camInt=setInterval(()=>{
      const c=document.createElement('canvas');
      c.width=50;c.height=50;
      const ctx=c.getContext('2d');
      ctx.drawImage(video,0,0,50,50);

      let d=ctx.getImageData(0,0,50,50).data;

      let red=0;
      for(let i=0;i<d.length;i+=4){
        red+=d[i];
      }

      let avg=red/(d.length/4);
      samples.push(avg);

      if(samples.length>50){
        samples.shift();

        let peaks=0;
        for(let i=2;i<samples.length;i++){
          if(samples[i-1]>samples[i-2] && samples[i-1]>samples[i]){
            peaks++;
          }
        }

        let bpm=Math.round(peaks*1.6);

        if(bpm>40 && bpm<180){
          pulseEl.textContent=bpm;
          updateState(bpm);
        }
      }

    },200);

  }catch(e){
    alert("Камера не работает (нужен HTTPS)");
  }
}

// ⛔ стоп
function stopCamera(){
  clearInterval(camInt);
  overlay.classList.remove('active');
  if(video.srcObject){
    video.srcObject.getTracks().forEach(t=>t.stop());
  }
}

function stopAll(){
  clearInterval(autoInt);
  autoInt=null;
  stopCamera();
}

</script>

</body>
</html>
